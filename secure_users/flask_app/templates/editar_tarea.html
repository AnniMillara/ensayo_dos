{% extends "base.html" %}
{% block title %}TaskTrack - Editar Tarea{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Editar Tarea</h2>
        <p>Modifica los datos de tu tarea.</p>
    </div>
</div>

<div class="card-bookhub">
    <form action="{{ url_for('modificar_tarea', id=tarea.id_tarea) }}" method="POST">
        <div class="mb-3">
            <label>Título</label>
            <input type="text" name="nombre" class="form-control" value="{{ tarea.nombre }}" required>
        </div>
        <div class="mb-3">
            <label>Categoría</label>
            <select name="categoria_id" class="form-select" required>
                {% for c in categorias %}
                <option value="{{ c.id_categoria }}"
                        {% if tarea.categoria_id|string == c.id_categoria|string %}selected{% endif %}>
                    {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Prioridad</label>
            <select name="prioridad_id" class="form-select" required>
                {% for p in prioridades %}
                <option value="{{ p.id_prioridad }}"
                        {% if tarea.prioridad_id|string == p.id_prioridad|string %}selected{% endif %}>
                    {{ p.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Estado</label>
            <select name="estado_id" class="form-select" required>
                {% for e in estados %}
                <option value="{{ e.id_estado }}"
                        {% if tarea.estado_id|string == e.id_estado|string %}selected{% endif %}>
                    {{ e.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="4" required>{{ tarea.descripcion }}</textarea>
        </div>
        <button type="submit" class="btn btn-dark">Actualizar</button>
        <a href="{{ url_for('tareas') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
