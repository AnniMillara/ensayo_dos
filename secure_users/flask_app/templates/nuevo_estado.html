{% extends "base.html" %}
{% block title %}TaskTrack - Nuevo Estado{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Nuevo Estado</h2>
    </div>
</div>

<div class="card-bookhub form-narrow">
    <form action="{{ url_for('crear_estado') }}" method="POST">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ datos.nombre if datos else '' }}" required>
        </div>
        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3"
                required>{{ datos.descripcion if datos else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label>Color</label>
            <input type="color" name="color" class="form-control form-color"
                value="{{ datos.color if datos else '#6b7280' }}">
        </div>
        <button type="submit" class="btn btn-dark">Guardar</button>
        <a href="{{ url_for('lista_estados') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
