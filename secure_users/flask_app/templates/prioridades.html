{% extends "base.html" %}

{% block title %}TaskTrack - Prioridades{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>Prioridades</h2>
        <p>Prioridades de tareas disponibles.</p>
    </div>
</div>

<div class="card-bookhub mb-4">
    <h3 style="margin-top:0; font-size: 1.05rem;">Agregar Prioridad</h3>
    <form action="{{ url_for('nueva_prioridad') }}" method="POST" style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" name="nombre" class="form-control" placeholder="Nombre de la prioridad" required style="flex:1; min-width:200px;">
        <button type="submit" class="btn btn-dark">+ Agregar</button>
    </form>
</div>

<div class="list-grid">
    {% for prioridad in lista_prioridad %}
    <div class="list-card">
        <span class="name">{{ prioridad.nombre }}</span>
        <div class="actions">
            <a href="{{ url_for('eliminar_prioridad', id=prioridad.id_prioridad) }}" class="btn btn-sm btn-danger">Borrar</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
