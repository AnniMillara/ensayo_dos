{% extends "base.html" %}
{% block title %}TaskTrack - Editar Categoría{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Editar Categoría</h2>
    </div>
</div>

<div class="card-bookhub">
    <form action="{{ url_for('modificar_categoria', id=categoria.id_categoria) }}" method="POST">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre }}" required>
        </div>
        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3" required>{{ categoria.descripcion }}</textarea>
        </div>
        <button type="submit" class="btn btn-dark">Actualizar</button>
        <a href="{{ url_for('lista_categorias') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
